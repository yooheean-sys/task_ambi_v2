[project]
name = "common"
version = "0.1.0"
description = "task_ambi_v4 共通層（kernel・モジュール間契約）"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
