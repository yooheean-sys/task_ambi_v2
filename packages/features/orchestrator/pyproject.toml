[project]
name = "orchestrator"
version = "0.1.0"
description = "orchestrator — 外側ループ（1 kickoff の周回・起票 1 箇所・人間へ渡す 1 経路）"
requires-python = ">=3.13"
dependencies = [
    "common",
    # HTTP の口（APIRouter）を持つ初の feature。**httpx は実行時依存に入れない**
    # （境界契約 httpx-scope の対象側。テストの TestClient はルートの dev 依存に載り、
    # src レイアウトのため grimp のグラフに載らない＝ research R-04）。
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
