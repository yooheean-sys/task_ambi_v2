[project]
name = "monitor"
version = "0.1.0"
description = "monitor — 1 kickoff の計測・上限停止・失敗の等級付けと盤面への写像"
requires-python = ">=3.13"
dependencies = [
    "common",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]
