subrequest:
  description: |
    担当 issue: {issue_id}
    タイトル: {title}

    issue の説明:
    {description}

    人間からの指示（(なし) 以外なら最優先の制約として扱うこと）:
    {human_guidance}

    前回の差し戻し理由（(なし) なら初回。あれば同じ失敗を繰り返さないよう指摘を反映すること）:
    {feedback}

    今回は**分解**の担当です。自分で作業はせず、子タスクの一覧を作ることだけを行います。

    ## 親タスクの受け入れ条件

    {acceptance}

    手順:
    1. read_issue で最新状態を確認する
    2. propose_breakdown に子タスクの一覧を**1回で全件**渡す
    3. record_progress に、なぜその分け方にしたかを1〜3文で記録する
    4. complete_issue で完了を申告する（**省略しないこと。**申告が無いと未完了として差し戻されます）

    分け方の決まり:
    - 2件以上に分ける。1件では親の言い換えにしかならない
    - 子どうしの関心事を分ける。同じ作業を2つの子に持たせない
    - 各子の受け入れ条件に、成果物のパスを outcome/ から始まる形で必ず書く
    - **受け入れ条件は 1 行 1 条件とし、各行の先頭に `- [ ] ` を付ける**
      （例: `- [ ] outcome/xxx.md が存在し、〜が記録されている`）。
      この形でない行はシステム側の検証で差し戻される
    - **親の受け入れ条件に成果物のファイル名が指定されている場合、子の成果物パスには
      その名前をそのまま使う。** 言い換えたり英語にしたりしない。名前がずれると、
      親の条件を満たすファイルが1つも存在しないまま全ての子が完了してしまう
    - 子の受け入れ条件は、親の受け入れ条件を分担してカバーするように書く。
      親の条件のどの項目も、どれかの子が引き受けている状態にする
    - 成果物のパスは子ごとに別にする。同じファイルを2つの子が書いてはいけない
    - 受け入れ条件は「第三者が実行して真偽を判定できる」文にする。
      「適切にまとめられていること」のように判定者で結論が変わる文は書かない
    - 他の子の完了を待つ必要がある子は、depends_on に**その子より前にある**兄弟の
      インデックス（0始まり）を書く。先行するものを先に並べること
    - 各子の persona に、下の一覧から作業内容に合う担当を割り当てる

    {persona_guide}

    検証に落ちたら指摘が返ります。指摘を読んで直し、propose_breakdown を呼び直してください。
    issue の ID を考える必要はありません。起票はシステム側が行います。
  expected_output: |-
    実施した作業と、記録・完了申告の結果を3行以内で述べたもの。
  agent: system_engineer
child:
  description: |
    担当 issue: {issue_id}
    タイトル: {title}

    issue の説明:
    {description}

    人間からの指示（(なし) 以外なら最優先の制約として扱うこと）:
    {human_guidance}

    前回の差し戻し理由（(なし) なら初回。あれば同じ失敗を繰り返さないよう指摘を反映すること）:
    {feedback}

    今回は**実行**の担当です。分解はせず、この issue の成果物を実際に書きます。

    ## このプロジェクトのリポジトリ

    コードの編纂に取りかかる場合のリポジトリは次のとおりです（両方とも空なら
    この節は無効です。リポジトリ未登録のプロジェクトなので、成果物はこれまでどおり
    outcome/ に書いてください）:

    - リモートリポジトリ: {repository_remote_url}
    - ローカルリポジトリ（OS の絶対パス）: {repository_local_path}

    **このタスクで作るファイル（この名前以外は成果物として認められません）:**
    {input_refs}

    ## この issue の受け入れ条件

    {acceptance}

    手順:
    1. read_issue で受け入れ条件を確認する
    2. list_input_files で読める入力ファイルを確認する
    3. 必要なものを read_input_file で読む
    4. タスクの説明が outcome/ 配下のファイルを参照している場合は、list_outcome_files で
       先行タスクの成果物を確認し、read_outcome_file でその中身を読む
    5. 上に挙げた名前で write_outcome を呼び、成果物を書く（全ての名前について1回ずつ）
    6. record_progress に何を書いたかを1〜3文で記録する
    7. complete_issue で完了を申告する

    守ること:
    - **ファイルを書く前に complete_issue を呼ばないこと。**
      成果物が無いまま申告しても、システム側の検証で差し戻されます
    - **書き終えたら必ず complete_issue を呼ぶこと。**
      ファイルを書いても申告が無ければ未完了として差し戻されます
    - write_outcome の filename には**上に挙げた名前をそのまま**渡す。
      別の名前で書いても成果物として認められません（outcome/ の部分は書かない。ファイル名だけ）
    - 情報源は list_input_files と list_outcome_files に出るファイルだけ。
      そこに無い事実を補って書かない
    - 入力に欠けているセクションがあっても、それを理由に作業を止めない。
      埋められないものは「記載なし」と書く
  expected_output: |-
    実施した作業と、記録・完了申告の結果を3行以内で述べたもの。
