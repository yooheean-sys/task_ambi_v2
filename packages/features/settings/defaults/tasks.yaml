# 出荷時既定の段テンプレート 7 キー（D16-a・D16-c・FR-055〜FR-057）。
# 移植元: crewai_beads_renkei（凍結・読取のみ）。写像は DIFF-09／R-21。
# 担当一覧は本文に焼き込まず {persona_guide} で入れる（D16-c の P1 担保）。
# description・expected_output は必ずブロックスカラー（|）で書く（Y-6・M-15 (b)）。
program:
  description: |
    担当 issue: {issue_id}
    タイトル: {title}

    issue の説明:
    {description}

    人間からの指示（(なし) 以外なら最優先の制約として扱うこと）:
    {human_guidance}

    前回の差し戻し理由（(なし) なら初回。あれば同じ失敗を繰り返さないよう指摘を反映すること）:
    {feedback}

    今回は**統括の分解**の担当です。自分で作業はせず、依頼を独立に進められる
    「プロジェクト」の一覧に振り分けることだけを行います。ここで提案する各項目は
    実行タスクではなく、**それぞれの担当がさらにワークストリームへ分解します。**
    自分は実行者を割り当てません。

    ## 統括の受け入れ条件

    {acceptance}

    手順:
    1. read_issue で最新状態を確認する
    2. propose_breakdown にプロジェクトの一覧を**1回で全件**渡す
    3. record_progress に、なぜその分け方にしたかを1〜3文で記録する
    4. complete_issue で完了を申告する（**省略しないこと。**申告が無いと未完了として差し戻されます）

    分け方の決まり:
    - 2件以上に分ける。1件では統括の言い換えにしかならない
    - プロジェクトどうしの関心事を分ける。互いに独立に進められる単位にする
    - 各プロジェクトは、それ自身の**機能説明**と、第三者が実行して真偽を判定できる
      **受け入れ条件**を持つこと
    - **受け入れ条件は 1 行 1 条件とし、各行の先頭に `- [ ] ` を付ける**
      （例: `- [ ] outcome/xxx.md が存在し、〜が記録されている`）。
      この形でない行はシステム側の検証で差し戻される
    - **統括の受け入れ条件に成果物のファイル名が指定されている場合、それを担当する
      プロジェクトの受け入れ条件にその名前を原文のまま引き継ぐ。** 言い換えたり
      英語にしたりしない。名前がずれると、統括の条件を満たすファイルが1つも
      存在しないまま全てのプロジェクトが完了してしまう
    - 成果物のファイル名はプロジェクトごとに別にする。同じファイル名を2つの
      プロジェクトに書いてはいけない
    - 各プロジェクトの persona に、下の一覧から担当を割り当てる
    - **depends_on は書かない。** プロジェクト間の依存はこの階層では扱わない

    {persona_guide}

    検証に落ちたら指摘が返ります。指摘を読んで直し、propose_breakdown を呼び直してください。
    issue の ID を考える必要はありません。起票はシステム側が行います。
  expected_output: |-
    実施した作業と、記録・完了申告の結果を3行以内で述べたもの。
  agent: planner
