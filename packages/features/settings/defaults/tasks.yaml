    {feedback}

    ## このプロジェクトのリポジトリ

    コードの編纂に取りかかる場合のリポジトリは次のとおりです（両方とも空なら
    この節は無効です。リポジトリ未登録のプロジェクトです）:

    - リモートリポジトリ: {repository_remote_url}
    - ローカルリポジトリ（OS の絶対パス）: {repository_local_path}

    ## この issue の受け入れ条件

    {acceptance}

    手順:
    1. read_issue で最新状態を確認する
    2. issue の指示どおりに作業し、成果物を作る
    3. record_progress に成果物そのものを記録する
    4. complete_issue で完了を申告する（result_summary には何を出したかを1〜2文で）

    **4 を省略しないこと。** 申告が無いまま終わると未完了として差し戻されます。

    判断できない点があれば、2 以降を行わず escalate_to_human を呼んで終了する。
  expected_output: |-
    実施した作業と、記録・完了申告の結果を3行以内で述べたもの。
review_normal:
  description: |
    レビュー対象 issue: {issue_id}
    タイトル: {title}

    issue の説明:
    {description}

    今回は**検収（レビュー）**の担当です。担当者が「完了」と申告した成果物を検分し、
    受け入れ条件を実質的に満たしているかを判定します。

    検分する成果物（ファイルの存在はシステム側で確認済み。見るのは中身の妥当性）:
    {input_refs}

    ## このプロジェクトのリポジトリ

    コードの検分に当たって、対象のリポジトリは次のとおりです（両方とも空なら
    この節は無効です。リポジトリ未登録のプロジェクトです）:

    - リモートリポジトリ: {repository_remote_url}
    - ローカルリポジトリ（OS の絶対パス）: {repository_local_path}

    ## この issue の受け入れ条件

    {acceptance}

    手順:
    1. read_issue で受け入れ条件を確認する
    2. list_outcome_files で成果物の一覧を確認する
    3. 上に挙げたファイルを read_outcome_file で全て読む
    4. 成果物が事実（数値・固有名詞・日付・完了状態）を主張している場合、その出典に当たる
       ファイルを**実際に読んで**突合する。出典は list_input_files に出る入力ファイルか、
       list_outcome_files に出る先行タスクの成果物のどちらか
    5. 受け入れ条件と照合し、submit_review を1回だけ呼んで判定を提出する

    判定の基準:
    - 受け入れ条件の各項目が、成果物の中身で実質的に満たされているか
    - 条件と無関係な内容へのすり替えや、根拠の無い事実の捏造が無いか
    - 軽微な文体・体裁だけを理由に却下しない。直すべき点を具体的に指摘できるときだけ却下する

    **読んでいないファイルについて「確認した」「捏造は無い」と述べないこと。**
    出典に当たっていないなら、その項目は「未確認」として扱ってください。
    feedback には、突合のために**実際に読んだファイル名を挙げて**ください。

    **submit_review を呼ばずに終わらないこと。** 呼ばずに終わると判定なしとして扱われます。
    却下する場合、feedback には「どのファイルのどこを、どう直すべきか」を書いてください。
    そのまま担当者への差し戻し指摘になります。
  expected_output: |-
    判定（承認/却下）と、その理由を2〜3行で述べたもの。
  tools:
    - read_issue
    - list_input_files
    - read_input_file
    - list_outcome_files
    - read_outcome_file
    - submit_review
