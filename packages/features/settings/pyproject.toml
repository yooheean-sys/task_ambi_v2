[project]
name = "settings"
version = "0.1.0"
description = "settings — 設定ファイル領域 A の唯一の所有者（読取・検査・保存・HTTP の口・設定画面）"
requires-python = ">=3.13"
dependencies = [
    "common",
    "casbin>=1.43,<2",
    "pyyaml>=6.0.3,<7",
    # HTTP の口（APIRouter）。**httpx は実行時依存に入れない**（境界契約 httpx-scope の対象側。
    # テストの TestClient はルートの dev 依存に載り、src レイアウトのため grimp のグラフに
    # 載らない＝ orchestrator の research R-04）。0.141.1・MIT・py.typed あり（010 SD-11）。
    "fastapi>=0.141,<1",
    # 設定画面（`ui.py` だけが import する）。3.17.1・MIT・py.typed あり（016 research R-16）。
    # **requests も httpx も足さない** —— HTTP クライアントは標準ライブラリ `urllib.request`
    # の `call_api` 1 関数に閉じる（010 SD-06・FR-088）。
    # 016 で Streamlit（1.62.0）から置き換えた（D23）。
    "nicegui>=3.17.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settings"]
