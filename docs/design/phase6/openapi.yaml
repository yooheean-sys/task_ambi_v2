      x-mod: settings
      x-fn: "settings-F21;settings-F18;settings-F24"
      summary: "段テンプレートの編集（7 キー必須。{変数} は許可集合＋段別必須の validate D16-c）"
      operationId: putGlobalTasks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTemplatesView" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTemplatesView" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/tasks/{project_key}:
    parameters:
      - $ref: "#/components/parameters/project_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F25"
      summary: "PJ の段テンプレート上書きの取得（キー単位・任意 D16-f）"
      operationId: getProjectTasks
      responses:
        "200":
          description: "上書き分（無ければ空）"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTemplatesView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F18;settings-F24"
      summary: "PJ の段テンプレート上書きの編集（キー丸ごと置換）"
      operationId: putProjectTasks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTemplatesView" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTemplatesView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F24"
      summary: "PJ の上書きを全て解除（global の 7 キーに戻る）"
      operationId: deleteProjectTasks
      responses:
        "204": { description: "解除済み" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings/llm-profiles:
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F13"
      summary: "LLM プロファイル一覧（既定 1 つを含む）"
      operationId: listLlmProfiles
      responses:
        "200":
          description: "一覧"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfilesView" }
    post:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F13"
      summary: "LLM プロファイル作成（api_key は参照名のみ。実値は .env）"
      operationId: createLlmProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileSpec" }
      responses:
        "201":
          description: "作成済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfileView" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/llm-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F13"
      summary: "LLM プロファイル取得"
      operationId: getLlmProfile
      responses:
        "200":
          description: "プロファイル"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfileView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F13"
      summary: "LLM プロファイル編集（is_default=true で既定を切替。context_window ≤ reserve は拒否）"
      operationId: updateLlmProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileSpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfileView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F13"
      summary: "LLM プロファイル削除（既定・agents.yaml の llm: から参照中は拒否 D16）"
      operationId: deleteLlmProfile
      responses:
        "204": { description: "削除済み" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }

  /settings/limits:
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F14"
      summary: "上限ポリシー（global 既定＋PJ 上書き一覧）"
      operationId: getLimits
      responses:
        "200":
          description: "上限"
          content:
