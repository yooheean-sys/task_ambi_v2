      operationId: putPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicySpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }

  /settings/rules/projects/{project_key}:
    parameters:
      - $ref: "#/components/parameters/project_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F17"
      summary: "PJ 共通ルール本文（projects/<key>/rules.md）"
      operationId: getProjectRules
      responses:
        "200":
          description: "本文"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextBody" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F17"
      summary: "PJ 共通ルール本文の置換"
      operationId: putProjectRules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextBody" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextBody" }
        "404": { $ref: "#/components/responses/NotFound" }
  /settings/hooks/{project_key}:
    parameters:
      - $ref: "#/components/parameters/project_key"
