# API Contract — task_ambi_v4 app プロセス（FastAPI）の HTTP 境界（第6フェーズ、D12-c）
# 正本の範囲: paths・method・応答コード・DTO の形。実装（M1）で FastAPI が生成する /openapi.json と paths／operation 単位で diff する。
# 出典: settings-F21／orchestrator-F13（P5D-035）／trigger-F11・F09（P5D-039〜042）／DIFF-27（/health。D12-e）／各 MOD の data_model（受け渡し型・内部 VO）
# 規約: prefix・版番号は置かない（憲章 §2「入口の FastAPI アプリは 1 個」）。認証なし（憲章 §10）。x-mod＝所有 MOD、x-fn＝対応 fn_id。
#       422＝Problem（validate 違反の一覧。settings／trigger 共通）、404＝Detail、409＝Detail（single-flight busy／プロジェクト削除ガード）。
#       クライアントは apps/ui（EIF-10）・自分（EIF-11）・Windows 側 PowerShell FSW（EIF-12）。
openapi: 3.1.0
info:
  title: task_ambi_v4 app API
  version: v4-design
  description: |
    モジュラーモノリス app プロセスの HTTP 入口。モジュール間は Protocol（関数呼び出し）で、HTTP は ui／人間／Windows 側からの入口にのみ使う（憲章 §4）。
    設定の反映区分: 権限ポリシー・コマンド定義は保存と同時に効く、その他（PJ・agents.yaml＝メンバ・tasks.yaml＝段テンプレート・LLM・上限・rules・hooks）は次回 kickoff から（P5D-016・D16）。
servers:
  - url: http://localhost:{APP_PORT}
    description: "WSL2 ホスト内。APP_PORT の実値は付3（環境依存値）"
    variables:
      APP_PORT:
        default: "8000"
tags:
  - name: health
    description: "apps/api 所有（liveness のみ。D12-e）"
  - name: settings
    description: "settings MOD（領域 A の CRUD。UC-07／UC-08）"
  - name: kickoffs
    description: "orchestrator MOD（human 起動と状態参照。P5D-035）"
  - name: triggers
    description: "trigger MOD（トリガー CRUD・手動実行・履歴・watcher・退避経路。UC-09／10）"

paths:
  /health:
    get:
      tags: [health]
      x-mod: apps/api
      x-fn: "—（実行エントリ＝ apps/api/src/api/main.py、composition root ＝ app.py／wiring.py／registry.py。DIFF-27／D12-e／DIFF-04）"
      summary: "liveness（プロセスが起きていれば 200。外部ツールには触れない）"
      operationId: getHealth
      responses:
        "200":
          description: "起動済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # ---------------- settings（UC-08 プロジェクト） ----------------
  /settings/projects:
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F11"
      summary: "プロジェクト一覧（_program を含む）"
      operationId: listProjects
      responses:
        "200":
          description: "一覧"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectView" }
    post:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F11"
      summary: "プロジェクト登録（キー規則 → VaultReader.check_project_folders → project.yaml 書込）"
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectSpec" }
      responses:
        "201":
          description: "登録済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/projects/{project_key}:
    parameters:
      - $ref: "#/components/parameters/project_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F03"
      summary: "プロジェクト取得"
      operationId: getProject
      responses:
        "200":
          description: "プロジェクト"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F11"
      summary: "プロジェクト編集（role_dir を外すときは当該ペルソナのメンバ＝agents.yaml のキーが居れば拒否 P5D-018）"
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectSpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F11"
      summary: "プロジェクト解除（_program 不可。open issue があるか盤面が読めなければ拒否 D06-j(4)。領域 A の PJ フォルダは _archive へ退避）"
      operationId: deleteProject
      responses:
        "204": { description: "解除済み" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /settings/projects/{project_key}/roles:
    parameters:
      - $ref: "#/components/parameters/project_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F07;settings-F09"
      summary: "役割ごとの実効設定（閲覧のみ。merge 済みメンバの装備 × policy.csv の許可・段の既定担当と Task.tools。D26）"
      operationId: listProjectRoles
      responses:
        "200":
          description: "PJ のメンバ全員分（PersonaKey の列挙順）"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolesView" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- settings（UC-07 AI 設定） ----------------
  /settings/agents:
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12;settings-F24"
      summary: "エージェント一覧（project_key で絞り込み可。global 既定と PJ 上書きの merge 結果 D16-d）"
      operationId: listAgents
      parameters:
        - name: project_key
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "一覧（PJ 指定時は merge 済みメンバ、無指定時は global のペルソナ既定）"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentView" }
  /settings/agents/global/{persona_key}:
    parameters:
      - $ref: "#/components/parameters/persona_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12"
      summary: "ペルソナ既定の取得（global/agents.yaml の 1 エントリ）"
      operationId: getGlobalAgent
      responses:
        "200":
          description: "ペルソナ既定"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSpec" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12;settings-F18"
      summary: "ペルソナ既定の編集（role・goal・backstory 必須。許可フィールド 10・未知キー拒否 D16-d）"
      operationId: putGlobalAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSpec" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/agents/{project_key}/{persona_key}:
    parameters:
      - $ref: "#/components/parameters/project_key"
      - $ref: "#/components/parameters/persona_key"
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12"
      summary: "メンバ取得（merge 済みの解決結果）"
      operationId: getAgent
      responses:
        "200":
          description: "メンバ"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12;settings-F18"
      summary: "メンバ作成・編集（projects/<key>/agents.yaml の 1 エントリを upsert。キーの存在＝メンバ・空 body 可 D16-d。ペルソナは PJ の role_dirs に登録済みであること P5D-018）"
      operationId: putAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSpec" }
      responses:
        "200":
          description: "作成・更新済み（台帳再導出済み）"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentView" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F12;settings-F19"
      summary: "メンバ削除（policy に主体が残れば逆方向 validate で拒否）"
      operationId: deleteAgent
      responses:
        "204": { description: "削除済み" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/tasks/global:
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F25"
      summary: "段テンプレートの取得（global/tasks.yaml の 7 キー D16-a）"
      operationId: getGlobalTasks
      responses:
        "200":
          description: "7 キーの段テンプレート"
