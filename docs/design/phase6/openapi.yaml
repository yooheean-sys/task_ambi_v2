    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F14"
      summary: "PJ 上書きの設定・置換"
      operationId: putProjectLimits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitSpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitsView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Problem" }
