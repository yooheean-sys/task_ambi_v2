      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitSpec" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitsView" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/limits/{project_key}:
