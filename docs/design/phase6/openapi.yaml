      summary: "コマンド定義一覧（DM-26。AI 到達不能領域 global/commands.yaml）"
      operationId: listCommands
      responses:
        "200":
          description: "一覧"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommandDef" }
    post:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F15"
      summary: "コマンド定義作成（argv は文字列リスト固定・shell 文字列不可）"
      operationId: createCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandDef" }
      responses:
        "201":
          description: "作成済み（保存と同時に効く）"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandDef" }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/commands/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F15"
      summary: "コマンド定義取得"
      operationId: getCommand
      responses:
        "200":
          description: "定義"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandDef" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      x-mod: settings
      x-fn: "settings-F21;settings-F15"
      summary: "コマンド定義編集"
      operationId: updateCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandDef" }
      responses:
        "200":
          description: "更新済み"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandDef" }
