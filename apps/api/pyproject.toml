[project]
name = "api"
version = "0.1.0"
description = "FastAPI 起動エントリ（composition root）"
requires-python = ">=3.13"
dependencies = [
    "common",
    "fastapi",
    "uvicorn",          # 実行エントリ（main()）。[standard] extra は入れない（research R-15）
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
common = { workspace = true }
