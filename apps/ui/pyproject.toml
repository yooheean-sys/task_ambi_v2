[project]
name = "ui"
version = "0.1.0"
description = "統合した起動点（app に NiceGUI の UI を /ui で載せる薄い器）"
requires-python = ">=3.13"
dependencies = [
    "common",
    "api",                  # 統合した起動点が create_app を呼ぶ（016・ui-over-api 契約で ui → api の 1 方向だけ許す）
    "nicegui>=3.17.1,<4",
    "pydantic-settings",
    # httpx は足さない —— UI は app の HTTP API を**標準ライブラリ**で叩く（feature の `ui.py` の
    # `call_api` が `urllib.request` に閉じる＝ FR-013）。apps/ui 自身は HTTP を叩かない
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]

[tool.uv.sources]
common = { workspace = true }
api = { workspace = true }
